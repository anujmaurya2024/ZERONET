server.port=${PORT:3001}
server.address=0.0.0.0
spring.application.name=zeronet-backend

# Database Configuration (H2 file database for local zero-config persistence, easily swappable with MySQL/PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/zeronetdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AI & Translation Configuration
zeronet.translation.default-provider=${TRANSLATION_PROVIDER:composite}
zeronet.translation.google-api-key=${GOOGLE_TRANSLATION_API_KEY:}
zeronet.translation.gemini-api-key=${GEMINI_API_KEY:}
zeronet.translation.openai-api-key=${OPENAI_API_KEY:}
zeronet.translation.rate-limit-per-minute=120
zeronet.translation.max-message-chars=2000

# Logging configuration
logging.level.root=INFO
logging.level.com.zeronet=INFO
logging.level.org.hibernate=WARN
